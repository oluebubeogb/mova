[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Mova AI background worker (queued chat / coding / image jobs, Quick-setup AI copy).
; Exits hourly by design; supervisord restarts it. Runs as www-data so SQLite files keep their owner.
[program:mova-ai-worker]
command=php /var/www/bin/ai-worker.php --daemon
directory=/var/www
user=www-data
autostart=true
autorestart=true
startsecs=0
startretries=100
stopwaitsecs=30
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
